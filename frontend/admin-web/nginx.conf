# 管理后台 nginx：静态托管（vite base=/admin/）
# 注意：vite 的 base 只影响资源 URL 前缀，dist 文件结构仍在根目录
# （/admin/assets/xxx → 实际文件 /usr/share/nginx/html/assets/xxx）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /admin 下的资源与路由：剥离前缀后按根目录找文件，SPA 路由回退到入口 index.html
    location /admin/ {
        rewrite ^/admin/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
