# 管理后台 nginx：静态托管（vite base=/admin/）
# 注意：vite 的 base 只影响资源 URL 前缀，dist 文件结构仍在根目录
# （/admin/assets/xxx → 实际文件 /usr/share/nginx/html/assets/xxx）
#
# 监听 8080 而非 80：镜像用的是 nginx-unprivileged（以非 root 运行），
# 非 root 进程无法绑定 1024 以下的特权端口，写 80 会直接启动失败。
#
# 安全头在每个 location 里重复声明：nginx 的 add_header 不继承 ——
# 某个 location 一旦自己写了 add_header，上级的全部失效。
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 带哈希的静态资源可长期缓存（前缀比 /admin/ 长，优先生效）
    location /admin/assets/ {
        rewrite ^/admin/(.*)$ /$1 break;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # /admin 下的资源与路由：剥离前缀后按根目录找文件，SPA 路由回退到入口 index.html。
    # 入口文件一律 no-cache：否则发版后浏览器仍用旧 index.html 引用已被删除的 chunk。
    location /admin/ {
        rewrite ^/admin/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
