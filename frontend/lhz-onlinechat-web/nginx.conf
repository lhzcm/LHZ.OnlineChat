# WebSocket 升级连接头处理
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    # 图片上传大小限制（后端限制 5MB，这里放宽到 10MB 预留 multipart 头部开销）
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # REST API 反代到后端
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理后台前端（独立应用，部署在 /admin/ 路径）
    location /admin/ {
        proxy_pass http://frontend-admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 上传的头像等静态文件
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        expires 7d;
    }

    # WebSocket 反代：/ws 路径改写为后端根路径（后端 WS 中间件监听根路径）
    location /ws {
        proxy_pass http://backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # 前端页面（history 路由回退）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Web App Manifest：默认 MIME 表不含 webmanifest，这里仅对该文件指定类型
    # （注意不能用 server 级 types 块——那会替换整个 MIME 映射导致其他文件变 octet-stream）
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }
}
