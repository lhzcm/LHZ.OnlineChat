# WebSocket 升级连接头处理
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# WebSocket 专用访问日志格式：JWT 通过查询串传递（/ws?token=...），
# 因此这里不记录 $request（它包含 $args），避免令牌落进访问日志；
# 方法、URI（不含参数）、状态码与 UA 仍然保留，排查连接问题够用。
log_format ws_no_args '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';

server {
    # 非特权 nginx 镜像以非 root 用户运行，无法绑定 1024 以下的 80 端口
    listen 8080;
    server_name _;

    # 图片上传大小限制（后端限制 5MB，这里放宽到 10MB 预留 multipart 头部开销）
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # gzip：nginx:alpine 默认关闭，前端 JS/CSS 体积大，必须显式开启
    gzip on;
    # 同源资源带上 Vary: Accept-Encoding，避免中间代理缓存错编码版本
    gzip_vary on;
    gzip_comp_level 6;
    # 过小的响应压缩收益低于开销
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml application/xml font/woff2;

    # 基础安全响应头（CSP 暂不启用：应用使用内联样式与 blob/data 图片，
    # 没有实测过的策略很可能直接打断渲染，等确认策略后再加）
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 页面与 /admin/ 都是同源应用，SAMEORIGIN 已足够且比 DENY 兼容性更好
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 静态资源（文件名带内容哈希）：7 天不可变缓存。
    # 只用一条 Cache-Control：expires 与 add_header 同时写会发出两个同名头，
    # 部分客户端/代理会因此判定缓存策略冲突而放弃缓存。
    # 注意：nginx 的 add_header 不会从上层继承（本 location 一旦有 add_header，
    # server 级的安全头就不会生效），因此这里需要重复声明。
    location /assets/ {
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # 入口文件必须每次回源校验：否则发版后客户端仍用旧 index.html，引用不到新的哈希资源
    location = /index.html {
        expires -1; # => Cache-Control: no-cache
    }

    # Service Worker 必须可更新，否则缓存策略/版本变更无法生效
    location = /sw.js {
        expires -1;
    }

    # REST API 反代到后端
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理后台前端（独立应用，部署在 /admin/ 路径）
    # 端口必须写 8080：管理后台镜像已换成 nginx-unprivileged，容器内不再监听 80
    location /admin/ {
        proxy_pass http://frontend-admin:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 上传的头像等静态文件
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        expires 7d;
    }

    # WebSocket 反代：/ws 路径改写为后端根路径（后端 WS 中间件监听根路径）
    location /ws {
        proxy_pass http://backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        # 用不含查询串的格式记录：令牌在 /ws?token=... 里，不能进日志
        access_log /dev/stdout ws_no_args;
    }

    # 前端页面（history 路由回退）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Web App Manifest：默认 MIME 表不含 webmanifest，这里仅对该文件指定类型
    # （注意不能用 server 级 types 块——那会替换整个 MIME 映射导致其他文件变 octet-stream）
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        # 清单也要及时更新（图标/名称变更后不应被旧缓存挡住）
        expires -1;
    }
}
